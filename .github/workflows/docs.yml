name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

# Issue #81 (fusion#2 CI efficiency retrofit): cancel superseded runs on the
# same ref so rapid pushes do not queue redundant validates.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Issue #81: cache the pip download wheel cache keyed on the project
      # metadata hash — setup-python only needs it for the validator's imports
      # (stdlib-only script, so this is cheap insurance for future deps).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-identity \
            --class core --entry service \
            --skip-dirs ".git,node_modules,.venv,build,data,deploy,dist,logs,tests,.pytest_cache,.ruff_cache,.gstack,.remember,.claude,fusion_identity.egg-info,.github"
