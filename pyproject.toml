[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-identity"
version = "0.1.0"
description = "Fusion tenant-identity service — JWT issuer + tenant registry + Postgres fusion_tenant (multi-tenant PRD §3)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dahai80" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
    "argon2-cffi>=23",
    "cryptography>=42",
    "pyotp>=2.9",
    "redis>=5",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "grpcio-health-checking>=1.62",
    "protobuf>=4.25",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "fakeredis>=2.20",
]

[project.scripts]
fusion-identity = "fusion_identity.app:main"

[tool.setuptools.packages.find]
include = ["fusion_identity*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"

[tool.pytest.ini_options.markers]
integration = "real Postgres fusion_tenant tests (run with -m integration)"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"fusion_identity/routes/*.py" = ["B008"]
"fusion_identity/deps.py" = ["B008"]
"fusion_identity/grpc/*_pb2*.py" = ["E501", "F401", "I001", "UP009"]
